<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<title>حضور ومتابعة فرع المدينة</title>
<style>
:root{--navy:#0b1f33;--blue:#1976d2;--bg:#f5f7fa;--card:#fff;--text:#152536;--muted:#718096;--line:#e7edf3;--green:#16a34a;--orange:#d97706;--red:#dc2626;--purple:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
.top{background:linear-gradient(135deg,#0b1f33,#123c5d);color:#fff;padding:22px 18px 28px}.topin{max-width:1180px;margin:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand h1{font-size:21px;margin:0 0 5px}.brand p{margin:0;color:#cbd8e5;font-size:13px}
.wrap{max-width:1180px;margin:-15px auto 35px;padding:0 15px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #0b1f330b;padding:18px;margin-bottom:15px}
.login{max-width:440px;margin:40px auto}.login h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #d7e0e8;border-radius:11px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--blue)}
.btn{width:100%;padding:13px;border-radius:11px;background:var(--blue);color:#fff;font-weight:800}.btn.secondary{background:#edf2f7;color:#26384a}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{width:auto;padding:9px 13px;font-size:13px}
.msg{padding:11px;border-radius:10px;margin-top:10px;font-size:13px}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#991b1b}
.userbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.user{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:13px;background:#e7f0fb;color:#1769aa;display:grid;place-items:center;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border-radius:16px;background:#fff;border:1px solid var(--line)}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:27px;font-weight:900;margin-top:5px}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.purple{color:var(--purple)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h3{margin:0;font-size:16px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{color:var(--muted);font-weight:800;background:#fafbfd}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.p-green{background:#ecfdf3;color:#15803d}.p-orange{background:#fff7ed;color:#c2410c}.p-red{background:#fef2f2;color:#b91c1c}.p-blue{background:#eff6ff;color:#1d4ed8}.p-purple{background:#f5f3ff;color:#6d28d9}
.empgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.emp{border:1px solid var(--line);border-radius:15px;padding:14px}.emphead{display:flex;justify-content:space-between;gap:8px}.empname{font-weight:900}.role{font-size:11px;color:var(--muted);margin-top:3px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.meta div{background:#f8fafc;border-radius:10px;padding:9px}.meta small{display:block;color:var(--muted);font-size:10px}.meta b{font-size:12px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.activity{padding:11px;border:1px solid var(--line);border-radius:12px;margin-top:8px}.activity b{font-size:13px}.muted{color:var(--muted);font-size:12px}
.notice{display:flex;align-items:flex-start;gap:10px;padding:13px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa;margin-bottom:9px}.notice strong{font-size:13px}.notice span{display:block;color:#9a3412;font-size:12px;margin-top:2px}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.empgrid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.top{padding:18px 14px 25px}.brand h1{font-size:18px}.wrap{padding:0 10px}.grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat .num{font-size:23px}.empgrid{grid-template-columns:1fr}.card{padding:14px;border-radius:15px}.actions{grid-template-columns:1fr}.userbar{align-items:flex-start}.brand{align-items:flex-start}}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
.map{height:330px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.confirm-overlay{position:fixed;inset:0;background:#061524aa;display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}
.confirm-box{width:min(440px,100%);background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0005}
.confirm-box h3{margin:0 0 8px}.confirm-info{background:#f8fafc;border-radius:13px;padding:13px;margin:12px 0}
.confirm-info div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e9eef3;font-size:13px}.confirm-info div:last-child{border-bottom:0}
.print-only{display:none}
@media print{
 body{background:#fff!important}.top,.footer,#loginCard,#app>.card.userbar,.no-print{display:none!important}
 .wrap{margin:0!important;padding:0!important;max-width:none!important}.card{box-shadow:none!important;border:0!important}
 .print-only{display:block!important}.map{display:none!important}
 table{min-width:0!important}th,td{font-size:10px;padding:7px}
}
</style>
</head>
<body>
<header class="top">
<div class="topin">
<div class="brand">
<div><h1>حضور ومتابعة فرع المدينة</h1><p>نظام متابعة الموظفين الميدانيين والمهام الحكومية</p></div>
<div id="clock" style="font-size:12px;color:#dbeafe;text-align:left"></div>
</div>
</div>
</header>

<main class="wrap">
<section id="loginCard" class="card login">
<h2>تسجيل الدخول</h2>
<p class="muted">ادخل باسم المستخدم وكلمة المرور المؤقتة — لا حاجة للبريد الإلكتروني.</p>
<div class="field"><label>اسم المستخدم</label><input id="username" type="text" autocomplete="username" autocapitalize="none" placeholder="مثال: ali"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
<button id="loginBtn" class="btn">دخول النظام</button>
<div id="loginMsg" class="msg hidden"></div>
</section>

<section id="app" class="hidden">
<div class="card userbar">
<div class="user"><div class="avatar" id="avatar">—</div><div><b id="userName">—</b><div class="muted" id="userRole">—</div></div></div>
<button id="logout" class="btn secondary small">تسجيل الخروج</button>
</div>
<div id="content"></div>
</section>
</main>
<div class="footer">نظام حضور ومتابعة فرع المدينة</div>

<script>
const SB_URL='https://lhwsduzaicatihhqinir.supabase.co';
const SB_KEY='sb_publishable_L7E8EbRqcrbYXoRUBiemhg_-yzrXUXo';
let token=localStorage.getItem('att_token')||'', me=null;
const $=id=>document.getElementById(id);
const roleName=r=>({SUPERVISOR:'مشرف الفرع',FIELD_REP:'مندوب ميداني',GOVERNMENT_REP:'معقب ومراجعات حكومية',WAREHOUSE_AMIN:'أمين مستودع'}[r]||r||'موظف');
const activityName=x=>({VISIT_CUSTOMER:'زيارة عميل',TRAVELING:'في الطريق',BRANCH:'في الفرع',OTHER:'نشاط آخر'}[x]||x||'—');
const taskName=x=>({NEW:'جديدة',IN_PROGRESS:'تحت الإجراء',COMPLETED:'مكتملة',FOLLOW_UP:'تحتاج متابعة',REJECTED:'مرفوضة'}[x]||x||'—');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function headers(auth=true){return {'apikey':SB_KEY,'Content-Type':'application/json',...(auth&&token?{'Authorization':'Bearer '+token}:{})}}
async function api(path,opt={}){let r=await fetch(SB_URL+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}});let b=null;try{b=await r.json()}catch{}if(!r.ok)throw Error(b?.msg||b?.message||b?.error_description||b?.error||`HTTP ${r.status}`);return b}
function save(d){token=d.access_token;localStorage.setItem('att_token',token)}
function logout(){token='';localStorage.removeItem('att_token');location.reload()}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'})}
function time(x){return x?new Date(x).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'—'}
function dateTime(x){return x?new Date(x).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}):'—'}
function setClock(){let d=new Date();$('clock').innerHTML=d.toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'})+'<br>'+d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(setClock,1000);setClock();

async function login(){
 const username=$('username').value.trim().toLowerCase(),password=$('password').value;
 if(!username||!password)return showLogin('أدخل اسم المستخدم وكلمة المرور.');
 const b=$('loginBtn');b.disabled=true;b.textContent='جارٍ الدخول...';
 try{
   const r=await fetch(SB_URL+'/functions/v1/ensure-username-login',{
     method:'POST',
     headers:{'Content-Type':'application/json','apikey':SB_KEY},
     body:JSON.stringify({username,code:password})
   });
   const info=await r.json();
   if(!r.ok) throw Error(info.error||'اسم المستخدم أو كلمة المرور غير صحيحة');
   const email=info.email||username+'@attendance.local';
   let d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password}),auth:false});
   save(d);await boot(d.user);
 }catch(e){showLogin('فشل تسجيل الدخول: '+e.message)}
 finally{b.disabled=false;b.textContent='دخول النظام'}
}
function showLogin(t,ok=false){$('loginMsg').className='msg '+(ok?'ok':'err');$('loginMsg').textContent=t}
async function boot(user){
 try{
  let rows=await api('/rest/v1/employees?select=*&auth_user_id=eq.'+encodeURIComponent(user.id));
  if(!rows.length){showLogin('تم الدخول لكن الحساب غير مربوط بموظف. يجب ربط auth_user_id بسجل الموظف.');logout();return}
  me=rows[0];$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');
  $('userName').textContent=me.name;$('userRole').textContent=roleName(me.role);$('avatar').textContent=(me.name||'?').trim().charAt(0);
  if(me.role==='SUPERVISOR')renderSupervisor();else if(me.role==='FIELD_REP')renderField();else if(me.role==='GOVERNMENT_REP')renderGov();else renderField();
 }catch(e){showLogin('تعذر تحميل النظام: '+e.message)}
}
$('loginBtn').onclick=login;$('logout').onclick=logout;

async function renderSupervisor(){
 $('content').innerHTML='<div id="loading" class="card">جارٍ تحميل لوحة المتابعة...</div>';
 try{
  let d=today();
  let [emps,att,acts,tasks]=await Promise.all([
   api('/rest/v1/employees?select=*&active=eq.true&order=name'),
   api('/rest/v1/attendance?select=*&work_date=eq.'+d),
   api('/rest/v1/activities?select=*&order=created_at.desc&limit=300'),
   api('/rest/v1/government_tasks?select=*&order=created_at.desc&limit=100')
  ]);
  const amap=Object.fromEntries(att.map(x=>[x.employee_id,x]));
  const latest={};acts.forEach(x=>{if(!latest[x.employee_id])latest[x.employee_id]=x});
  const present=att.filter(x=>x.check_in).length;
  const late=att.filter(x=>Number(x.late_minutes||0)>0).length;
  const checkedOut=att.filter(x=>x.check_out).length;
  const pendingTasks=tasks.filter(x=>!['COMPLETED','REJECTED'].includes(x.status)).length;
  $('content').innerHTML=`
  <div class="grid">
   <div class="stat"><div class="label">الحضور اليوم</div><div class="num green">${present}</div><div class="muted">من ${emps.length} موظفين</div></div>
   <div class="stat"><div class="label">المتأخرون</div><div class="num orange">${late}</div><div class="muted">بحسب وقت 08:00</div></div>
   <div class="stat"><div class="label">لم ينصرفوا</div><div class="num blue">${Math.max(0,present-checkedOut)}</div><div class="muted">دوام مفتوح</div></div>
   <div class="stat"><div class="label">مهام حكومية مفتوحة</div><div class="num purple">${pendingTasks}</div><div class="muted">تحتاج متابعة</div></div>
  </div>
  <div class="card">
   <div class="sectionhead"><h3>إدارة كلمات مرور الموظفين</h3><span class="pill p-purple">للمشرف فقط</span></div>
   <div class="field"><label>الموظف</label><select id="pwEmployee"><option value="">جارٍ التحميل...</option></select></div>
   <div class="field"><label>كلمة المرور المؤقتة</label><input id="pwValue" type="text" placeholder="8 أحرف على الأقل"></div>
   <div class="actions">
    <button class="btn secondary" onclick="generateTempPassword()">توليد كلمة مرور</button>
    <button class="btn" onclick="resetEmployeePassword()">حفظ كلمة المرور</button>
   </div>
   <div id="pwMsg"></div>
  </div>
  <div class="card"><div class="sectionhead"><h3>حالة الموظفين الآن</h3><div class="no-print"><button class="btn secondary small" onclick="printDailyReport()">🖨️ طباعة الكشف اليومي</button> <button class="btn secondary small" onclick="renderSupervisor()">↻ تحديث</button></div></div>
   <div class="empgrid">${emps.map(e=>empCard(e,amap[e.id],latest[e.id])).join('')}</div>
  </div>
  <div class="card"><div class="sectionhead"><h3>خريطة مواقع الحضور اليوم</h3><span class="muted">آخر موقع مسجل لكل موظف</span></div><div id="supervisorMap" class="map"></div></div>
  <div class="card"><div class="sectionhead"><h3>سجل الحضور اليوم</h3></div>
   <div class="tablewrap"><table><thead><tr><th>الموظف</th><th>الدور</th><th>الحضور</th><th>التأخير</th><th>الانصراف</th><th>آخر نشاط</th></tr></thead>
   <tbody>${emps.map(e=>{let a=amap[e.id],x=latest[e.id];return `<tr><td><b>${esc(e.name)}</b></td><td>${roleName(e.role)}</td><td>${a?.check_in?'<span class="pill p-green">حاضر</span>':'<span class="pill p-red">لم يسجل</span>'} ${time(a?.check_in)}</td><td>${a?.late_minutes?'<span class="pill p-orange">'+a.late_minutes+' دقيقة</span>':'—'}</td><td>${time(a?.check_out)}</td><td>${activityName(x?.activity_type)}<br><span class="muted">${dateTime(x?.created_at)}</span></td></tr>`}).join('')}</tbody></table></div>
  </div>
  <div class="card"><div class="sectionhead"><h3>آخر الزيارات الميدانية</h3><span class="muted">وصول ومغادرة العملاء</span></div>
   <div id="recentVisits">جارٍ التحميل...</div>
  </div>
  <div class="card"><div class="sectionhead"><h3>تنبيهات المتابعة</h3></div>
   ${emps.filter(e=>!amap[e.id]?.check_in).map(e=>`<div class="notice"><div>⚠️</div><div><strong>${esc(e.name)} لم يسجل الحضور</strong><span>لم يظهر تسجيل حضور لهذا اليوم حتى الآن.</span></div></div>`).join('')||'<div class="muted">لا توجد تنبيهات حضور.</div>'}
  </div>`;
  initSupervisorMap(amap, emps);
  renderRecentVisits(acts, emps);
  const sel=$('pwEmployee');
  if(sel) sel.innerHTML=emps.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(roleName(e.role))}</option>`).join('');
 }catch(e){$('content').innerHTML='<div class="card msg err">تعذر تحميل لوحة المشرف: '+esc(e.message)+'</div>'}
}
function empCard(e,a,x){
 let status=a?.check_in?(a?.check_out?'انصرف':'حاضر'):'لم يسجل';
 let cls=status==='حاضر'?'p-green':status==='انصرف'?'p-blue':'p-red';
 return `<div class="emp"><div class="emphead"><div><div class="empname">${esc(e.name)}</div><div class="role">${roleName(e.role)}</div></div><span class="pill ${cls}">${status}</span></div><div class="meta"><div><small>الحضور</small><b>${time(a?.check_in)}</b></div><div><small>التأخير</small><b>${a?.late_minutes||0} د</b></div><div><small>آخر نشاط</small><b>${activityName(x?.activity_type)}</b></div><div><small>آخر تحديث</small><b>${time(x?.created_at)}</b></div></div></div>`
}

async function gps(){if(!navigator.geolocation)throw Error('المتصفح لا يدعم تحديد الموقع');return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>ok(p.coords),()=>no(Error('اسمح بالوصول للموقع ثم حاول مرة أخرى')), {enableHighAccuracy:true,timeout:15000,maximumAge:0}))}

function generateTempPassword(){
 const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$';
 let out=''; const a=new Uint32Array(10); crypto.getRandomValues(a);
 for(let i=0;i<a.length;i++) out+=chars[a[i]%chars.length];
 $('pwValue').value=out;
}
async function resetEmployeePassword(){
 const employeeId=$('pwEmployee')?.value, password=$('pwValue')?.value||'';
 if(!employeeId)return;
 if(password.length<8){$('pwMsg').innerHTML='<div class="msg err">كلمة المرور يجب أن تكون 8 أحرف على الأقل.</div>';return;}
 const btn=event?.currentTarget; if(btn) btn.disabled=true;
 try{
  const r=await fetch(SB_URL+'/functions/v1/admin-reset-employee-password',{
   method:'POST',
   headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+token},
   body:JSON.stringify({employee_id:employeeId,password})
  });
  const d=await r.json();
  if(!r.ok) throw Error(d.error||'تعذر تغيير كلمة المرور');
  $('pwMsg').innerHTML='<div class="msg ok">تم تعيين كلمة المرور بنجاح. سلّم الموظف كلمة المرور المؤقتة، وسيستخدم اسم المستخدم فقط عند الدخول.</div>';
 }catch(e){$('pwMsg').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}
 finally{if(btn) btn.disabled=false;}
}

async function renderField(){
 $('content').innerHTML=`<div class="card"><div class="sectionhead"><h3>دوامي اليوم</h3><span class="pill p-blue">${today()}</span></div><div id="myDay">جارٍ التحميل...</div></div>
 <div class="card"><div class="sectionhead"><h3>موقع حضوري</h3><span class="muted">يظهر بعد تسجيل الحضور أو النشاط</span></div><div id="myMap" class="map"></div></div>
 <div class="card">
 <h3>المتابعة الميدانية</h3>
 <div class="field"><label>اسم العميل / الموقع</label><input id="visitCustomer" placeholder="مثال: مؤسسة فلان"></div>
 <div class="actions">
  <button class="btn" onclick="arriveAtVisit()">📍 وصلت للموقع</button>
  <button class="btn secondary" onclick="leaveVisit()">🚗 غادرت الموقع</button>
 </div>
 <div class="field"><label>حالة النشاط</label><select id="actType"><option value="VISIT_CUSTOMER">زيارة عميل</option><option value="TRAVELING">في الطريق</option><option value="BRANCH">في الفرع</option><option value="OTHER">نشاط آخر</option></select></div>
 <div class="field"><label>ملاحظة</label><input id="actNote" placeholder="مثال: مقابلة العميل / متابعة عرض / طلب تسعير"></div>
 <button class="btn secondary" onclick="sendActivity()">تحديث النشاط + الموقع</button>
 <div id="visitState" class="muted" style="margin-top:10px"></div><div id="actMsg"></div>
</div>
 <div class="card"><h3>سجل نشاطي اليوم</h3><div id="myActs">جارٍ التحميل...</div></div>`;
 await loadField();
}
async function loadField(){
 let d=today(),att=await api('/rest/v1/attendance?select=*&employee_id=eq.'+me.id+'&work_date=eq.'+d),a=att[0];
 $('myDay').innerHTML=`<div class="actions">${a?.check_in?`<div class="stat"><div class="label">وقت الحضور</div><div class="num green">${time(a.check_in)}</div></div>`:`<button class="btn" onclick="checkIn()">📍 تسجيل الحضور</button>`}${a?.check_out?`<div class="stat"><div class="label">الانصراف</div><div class="num">${time(a.check_out)}</div></div>`:`${a?.check_in?'<button class="btn secondary" onclick="checkOut()">إنهاء الدوام</button>':''}`}</div>${a?.late_minutes?`<div class="msg err">تأخير اليوم: ${a.late_minutes} دقيقة</div>`:''}`;
 if(a?.start_latitude && a?.start_longitude) initMyMap(Number(a.start_latitude),Number(a.start_longitude),me.name);
 else initMyMap(24.47,39.61,'بانتظار تسجيل الموقع');
 let acts=await api('/rest/v1/activities?select=*&employee_id=eq.'+me.id+'&created_at=gte.'+encodeURIComponent(new Date(d+'T00:00:00+03:00').toISOString())+'&order=created_at.desc&limit=30');
 const lastVisit=acts.find(x=>String(x.note||'').startsWith('VISIT_'));
if(lastVisit){
 const n=String(lastVisit.note||''); const k=n.startsWith('VISIT_ARRIVED')?'وصل':'غادر'; const customer=n.replace(/^VISIT_(ARRIVED|LEFT)\|/,'').split('|')[0]||'الموقع';
 setVisitState(`آخر حركة: ${k} ${customer} — ${dateTime(lastVisit.created_at)}`);
}
$('myActs').innerHTML=acts.length?acts.map(x=>{
 let n=String(x.note||'بدون ملاحظة'), display=n;
 if(n.startsWith('VISIT_ARRIVED|')){let p=n.split('|');display=`🟢 وصل إلى العميل: ${esc(p[1]||'الموقع')}${p[2]?` — ${esc(p[2])}`:''}`}
 else if(n.startsWith('VISIT_LEFT|')){let p=n.split('|');display=`🔵 غادر العميل: ${esc(p[1]||'الموقع')}`}
 return `<div class="activity"><b>${activityName(x.activity_type)}</b><div class="muted">${dateTime(x.created_at)} — ${display}</div></div>`
}).join(''):'<div class="muted">لا يوجد نشاط مسجل اليوم.</div>';
}

async function saveAttendanceIn(c,now){
 const d=today(),rows=await api('/rest/v1/attendance?select=*&employee_id=eq.'+me.id+'&work_date=eq.'+d);
 let shift=new Date(d+'T08:00:00+03:00'),late=Math.max(0,Math.floor((now-shift)/60000));
 let payload={employee_id:me.id,work_date:d,check_in:now.toISOString(),start_latitude:c.latitude,start_longitude:c.longitude,start_accuracy:c.accuracy,status:late?'LATE':'PRESENT',late_minutes:late,updated_at:now.toISOString()};
 let attendanceId;
 if(rows.length){attendanceId=rows[0].id;await api('/rest/v1/attendance?id=eq.'+attendanceId,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)})}
 else{let created=await api('/rest/v1/attendance',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});attendanceId=created?.[0]?.id||null}
 await api('/rest/v1/activities',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({employee_id:me.id,attendance_id:attendanceId,activity_type:'OTHER',latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,note:'تأكيد الحضور'})});

let supervisorLeaflet=null,myLeaflet=null;
function initSupervisorMap(amap,emps){
 const el=$('supervisorMap'); if(!el||typeof L==='undefined')return;
 if(supervisorLeaflet){supervisorLeaflet.remove();supervisorLeaflet=null}
 const points=[];
 emps.forEach(e=>{
  const a=amap[e.id];
  if(a?.start_latitude && a?.start_longitude) points.push([Number(a.start_latitude),Number(a.start_longitude),e.name,a]);
 });
 const center=points.length?[points[0][0],points[0][1]]:[24.47,39.61];
 supervisorLeaflet=L.map(el).setView(center,points.length?12:6);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(supervisorLeaflet);
 points.forEach(p=>L.marker([p[0],p[1]]).addTo(supervisorLeaflet).bindPopup(`<b>${esc(p[2])}</b><br>الحضور: ${time(p[3].check_in)}<br>التأخير: ${p[3].late_minutes||0} دقيقة`));
 if(points.length>1) supervisorLeaflet.fitBounds(points.map(p=>[p[0],p[1]]),{padding:[25,25]});
}
function initMyMap(lat,lng,name){
 const el=$('myMap'); if(!el||typeof L==='undefined')return;
 if(myLeaflet){myLeaflet.remove();myLeaflet=null}
 myLeaflet=L.map(el).setView([lat,lng],15);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(myLeaflet);
 if(Number.isFinite(lat)&&Number.isFinite(lng)) L.marker([lat,lng]).addTo(myLeaflet).bindPopup(`<b>${esc(name)}</b><br>موقع الحضور/النشاط`).openPopup();
}

 }).join(''):'<div class="muted">لا توجد زيارات مسجلة.</div>';

function setVisitState(text){const e=$('visitState');if(e)e.textContent=text}
async function recordVisit(kind){
 try{
  const customer=($('visitCustomer')?.value||'').trim();
  if(!customer){$('actMsg').innerHTML='<div class="msg err">اكتب اسم العميل أو الموقع أولًا.</div>';return}
  const c=await gps(), d=today();
  const note=`VISIT_${kind}|${customer}|${$('actNote')?.value||''}`;
  await api('/rest/v1/activities',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({
   employee_id:me.id,activity_type:'VISIT_CUSTOMER',latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,note
  })});
  setVisitState(kind==='ARRIVED'?`✓ وصلت إلى ${customer} — ${time(new Date())}`:`✓ غادرت ${customer} — ${time(new Date())}`);
  $('actMsg').innerHTML='<div class="msg ok">تم تسجيل الموقع والوقت بنجاح.</div>';
  if($('actNote'))$('actNote').value='';
  await loadField(); initMyMap(c.latitude,c.longitude,me.name);
 }catch(e){$('actMsg').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}
}

async function confirmGovAttendance(){
 const msg=$('govAttendanceMsg');
 try{
  msg.innerHTML='<div class="msg">جارٍ الحصول على موقعك...</div>';
  const c=await gps();
  const now=new Date();
  const ok=await showAttendanceConfirmation(c,now);
  if(!ok){msg.innerHTML='';return;}

  const d=today();
  const shift=new Date(d+'T08:00:00+03:00');
  const late=Math.max(0,Math.floor((now-shift)/60000));
  const rows=await api('/rest/v1/attendance?select=*&employee_id=eq.'+me.id+'&work_date=eq.'+d);

  const payload={
   employee_id:me.id,work_date:d,check_in:now.toISOString(),
   start_latitude:c.latitude,start_longitude:c.longitude,start_accuracy:c.accuracy,
   status:late?'LATE':'PRESENT',late_minutes:late,updated_at:now.toISOString()
  };

  let attendanceId=rows[0]?.id;
  if(attendanceId){
   await api('/rest/v1/attendance?id=eq.'+attendanceId,{
    method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)
   });
  }else{
   const created=await api('/rest/v1/attendance',{
    method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)
   });
   attendanceId=created?.[0]?.id;
  }

  await api('/rest/v1/activities',{
   method:'POST',headers:{Prefer:'return=minimal'},
   body:JSON.stringify({
    employee_id:me.id,attendance_id:attendanceId,activity_type:'OTHER',
    latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,
    note:'تأكيد حضور — يحيى الكلابي — معقب ومراجعات حكومية'
   })
  });

  msg.innerHTML='<div class="msg ok">✓ تم تأكيد حضورك وتسجيل موقعك بنجاح.</div>';
  await loadGovAttendance();
 }catch(e){
  msg.innerHTML='<div class="msg err">تعذر تسجيل الحضور: '+esc(e.message)+'</div>';
 }
}

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<title>شركة خالد عبدالله الصافي — فرع المدينة المنورة | نظام تحضير منسوبي الفرع</title>
<style>
:root{
 --navy:#08284a;--navy2:#0b3764;--blue:#1769b5;--blue2:#237dcc;
 --bg:#f4f7fb;--card:#fff;--text:#16283a;--muted:#718096;--line:#e4eaf1;
 --green:#159447;--orange:#e58a00;--red:#d72d36;--purple:#6941c6;--shadow:0 6px 22px rgba(12,39,65,.08)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
.top{background:#fff;color:var(--text);padding:15px 18px 0;border-bottom:1px solid #dfe7ef;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.topin{max-width:1180px;margin:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 4px 14px}
.brandLogo{width:126px;height:94px;object-fit:contain;flex:0 0 auto}
.company{flex:1;text-align:center}
.company h1{font-size:25px;line-height:1.2;margin:0;color:#092b50;font-weight:900}
.company h2{font-size:18px;margin:4px 0 4px;color:#1769b5;font-weight:900}
.company p{margin:0;color:#182b3d;font-size:14px;font-weight:700}
.branchMark{width:74px;height:74px;border-radius:50%;background:#0b2d52;color:#fff;display:grid;place-items:center;font-size:32px;flex:0 0 auto}
.nav{display:flex;align-items:stretch;justify-content:flex-start;background:linear-gradient(90deg,#06274a,#0d3965);margin:0 -18px;padding:0 18px;min-height:52px}
.nav button{background:transparent;color:#fff;padding:13px 22px;font-weight:800;border-left:1px solid rgba(255,255,255,.15);min-width:120px}
.nav button:first-child{border-right:3px solid #f3c400}
.nav button:hover{background:rgba(255,255,255,.08)}
.wrap{max-width:1180px;margin:20px auto 35px;padding:0 15px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:18px;margin-bottom:15px}
.login{max-width:440px;margin:45px auto}
.login h2{margin-top:0;color:var(--navy)}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px;border:1px solid #d7e0e8;border-radius:11px;outline:none;background:#fff}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,181,.08)}
.btn{width:100%;padding:13px;border-radius:11px;background:var(--blue);color:#fff;font-weight:800}
.btn.secondary{background:#edf3f8;color:#26384a}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{width:auto;padding:9px 13px;font-size:13px}
.msg{padding:11px;border-radius:10px;margin-top:10px;font-size:13px}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#991b1b}
.userbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.user{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:50%;background:#e8f1fa;color:#1769b5;display:grid;place-items:center;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:17px;border-radius:13px;background:#fff;border:1px solid var(--line);min-height:92px}
.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:26px;font-weight:900;margin-top:5px}
.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.purple{color:var(--purple)}.blue{color:var(--blue)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.sectionhead h3{margin:0;font-size:16px;color:#123f70}
.tablewrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;min-width:920px;overflow:hidden;border:1px solid var(--line);border-radius:12px}
th,td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{color:#5d6d7e;font-weight:800;background:#f7f9fc}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.p-green{background:#ecfdf3;color:#15803d}.p-orange{background:#fff7ed;color:#c2410c}.p-red{background:#fef2f2;color:#b91c1c}.p-blue{background:#eff6ff;color:#1d4ed8}.p-purple{background:#f5f3ff;color:#6d28d9}
.empgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.emp{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}
.emphead{display:flex;justify-content:space-between;gap:8px}.empname{font-weight:900}.role{font-size:11px;color:var(--muted);margin-top:3px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.meta div{background:#f7f9fc;border-radius:10px;padding:9px}.meta small{display:block;color:var(--muted);font-size:10px}.meta b{font-size:12px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.activity{padding:11px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}
.activity b{font-size:13px}.muted{color:var(--muted);font-size:12px}.notice{display:flex;align-items:flex-start;gap:10px;padding:13px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa;margin-bottom:9px}
.notice strong{font-size:13px}.notice span{display:block;color:#9a3412;font-size:12px;margin-top:2px}.footer{text-align:center;color:#fff;background:#08284a;font-size:11px;padding:13px;margin-top:25px}
.map{height:330px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.confirm-overlay{position:fixed;inset:0;background:#061524aa;display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}
.confirm-box{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0005}
.confirm-box h3{margin:0 0 8px}.confirm-info{background:#f8fafc;border-radius:13px;padding:13px;margin:12px 0}
.confirm-info div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e9eef3;font-size:13px}.confirm-info div:last-child{border-bottom:0}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.report-box{border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center}.report-box b{display:block;font-size:18px;margin-top:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar .btn{width:auto}.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#content>.card:first-child{border-top:4px solid #f2c400}
@media(max-width:850px){
 .grid{grid-template-columns:repeat(2,1fr)}.empgrid{grid-template-columns:1fr 1fr}
 .brandLogo{width:100px;height:80px}.company h1{font-size:21px}.company h2{font-size:16px}.branchMark{width:60px;height:60px;font-size:25px}
 .nav{overflow:auto}.nav button{min-width:105px;padding:12px 14px}
}
@media(max-width:600px){
 .top{padding:12px 10px 0}.brand{gap:9px}.brandLogo{width:78px;height:65px}.company h1{font-size:17px}.company h2{font-size:13px}.company p{font-size:10px}.branchMark{width:46px;height:46px;font-size:19px}
 .nav{margin:0 -10px;padding:0 5px;min-height:46px}.nav button{min-width:90px;padding:10px 9px;font-size:11px}
 .wrap{padding:0 10px;margin-top:12px}.grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat .num{font-size:22px}
 .empgrid{grid-template-columns:1fr}.card{padding:14px;border-radius:13px}.actions{grid-template-columns:1fr}.userbar{align-items:flex-start}
 .report-grid{grid-template-columns:1fr 1fr}.range{grid-template-columns:1fr}
}
@media print{
 body{background:#fff!important}.top,.footer,#loginCard,#app>.card.userbar,.no-print{display:none!important}
 .wrap{margin:0!important;padding:0!important;max-width:none!important}.card{box-shadow:none!important;border:0!important}
 .map{display:none!important}table{min-width:0!important}th,td{font-size:9px;padding:6px}.print-page{display:block!important}
}


/* V14 KAS TIRES visual layer - functionality remains V13 */
.top{background:linear-gradient(135deg,#061b30,#0b3150)!important;padding:0!important;border-bottom:4px solid #f2c300!important}
.topin{max-width:1180px!important;margin:auto!important;padding:14px 18px!important}
.brand{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:20px!important}
.brandLogo{width:150px!important;height:96px!important;object-fit:contain!important;background:#fff!important;border-radius:14px!important;padding:7px!important;box-shadow:0 5px 18px rgba(0,0,0,.18)!important}
.brandText{text-align:center!important;flex:1!important;color:#fff!important}
.brandText h1{margin:0!important;font-size:30px!important;font-weight:900!important;letter-spacing:.2px!important}
.brandText h2{margin:4px 0!important;font-size:20px!important;color:#f2c300!important}
.brandText p{margin:4px 0 0!important;font-size:16px!important;color:#e8f1f8!important}
.companyBadge{min-width:170px!important;text-align:center!important;color:#fff!important;font-weight:800!important}
.companyBadge .mini{font-size:13px!important;color:#cbd9e7!important;font-weight:600!important;margin-top:4px!important}
@media(max-width:700px){.brand{flex-direction:column!important}.brandLogo{width:115px!important;height:74px!important}.brandText h1{font-size:23px!important}.brandText h2{font-size:17px!important}.brandText p{font-size:13px!important}.companyBadge{min-width:0!important}}
</style>

function distanceMeters(lat1,lon1,lat2,lon2){const R=6371000,toRad=x=>x*Math.PI/180,dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1),a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function fieldAttendanceInfo(c){const d=distanceMeters(Number(c.latitude),Number(c.longitude),BRANCH_LAT,BRANCH_LNG);return {distance:Math.round(d),inside:d<=BRANCH_RADIUS,type:d<=BRANCH_RADIUS?'BRANCH':'FIELD'}}

async function login(){const username=$('username').value.trim().toLowerCase(),password=$('password').value;if(!username||!password){showLogin('أدخل اسم المستخدم وكلمة المرور.');return}const b=$('loginBtn');b.disabled=true;b.textContent='جارٍ الدخول...';try{const r=await fetch(SB_URL+'/functions/v1/ensure-username-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({username,code:password})});const info=await r.json();if(!r.ok)throw Error(info.error||'اسم المستخدم أو كلمة المرور غير صحيحة');const email=info.email||username+'@attendance.local';let d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password}),auth:false});save(d);await boot(d.user)}catch(e){showLogin('فشل تسجيل الدخول: '+e.message)}finally{b.disabled=false;b.textContent='دخول النظام'}}

async function saveIn(employeeId,c,now,note='تأكيد الحضور',attendanceMode=null){let d=today(),rows=await api('/rest/v1/attendance?select=*&employee_id=eq.'+employeeId+'&work_date=eq.'+d);let shift=shiftStartDate(),late=Math.max(0,Math.floor((now-shift)/60000));let payload={employee_id:employeeId,work_date:d,check_in:now.toISOString(),start_latitude:c.latitude,start_longitude:c.longitude,start_accuracy:c.accuracy,status:late?'LATE':'PRESENT',late_minutes:late,updated_at:now.toISOString()};let id=rows[0]?.id;if(id)await api('/rest/v1/attendance?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});else{id=(await api('/rest/v1/attendance',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)}))?.[0]?.id}await api('/rest/v1/activities',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({employee_id:employeeId,attendance_id:id||null,activity_type:'OTHER',latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,note:attendanceMode?('ATTENDANCE_MODE:'+attendanceMode.type+'|'+(attendanceMode.reason||'')):note})});return id}

function sendAttendanceWhatsApp(eid){

  if(!e.phone){alert('لا يوجد رقم جوال مسجل لهذا الموظف.');return}

async function govCheckIn(){if(guardAfterShift())return;try{let c=await gps(),now=new Date();if(await attendanceConfirmation(c,now))await saveIn(me.id,c,now,'تأكيد حضور — يحيى الكلابي — معقب ومراجعات حكومية');await loadGovAttendance()}catch(e){$('govMsg').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}async function govCheckOut(){try{let rows=await api('/rest/v1/attendance?select=*&employee_id=eq.'+me.id+'&work_date=eq.'+today());if(!rows.length)throw Error('سجل الحضور أولًا');await api('/rest/v1/attendance?id=eq.'+rows[0].id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({check_out:new Date().toISOString(),updated_at:new Date().toISOString()})});await loadGovAttendance()}catch(e){$('govMsg').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
function drawGovMap(lat,lng,name){let el=$('govMap');if(!el||typeof L==='undefined')return;let m=L.map(el).setView([Number(lat),Number(lng)],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);L.marker([Number(lat),Number(lng)]).addTo(m).bindPopup(esc(name)).openPopup()}
async function addGov(){if(guardAfterShift())return;try{let authority=$('authority').value.trim(),transaction=$('transaction').value.trim();if(!authority||!transaction)throw Error('أدخل الجهة والمعاملة أولًا');await api('/rest/v1/government_tasks',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({employee_id:me.id,authority,transaction,status:$('taskStatus').value,notes:$('taskNote').value.trim(),started_at:new Date().toISOString()})});$('authority').value='';$('transaction').value='';$('taskNote').value='';$('govTaskMsg').innerHTML='<div class="msg ok">✓ تمت إضافة المهمة.</div>';await loadGov()}catch(e){$('govTaskMsg').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
async function loadGov(){let rows=await api('/rest/v1/government_tasks?select=*&employee_id=eq.'+me.id+'&order=created_at.desc&limit=100');$('govList').innerHTML=rows.map(t=>`<div class="activity"><div style="display:flex;justify-content:space-between"><b>${esc(t.authority)}</b><span class="pill p-blue">${taskName(t.status)}</span></div><div>${esc(t.transaction)}</div><div class="muted">${dateTime(t.created_at)}${t.notes?' — '+esc(t.notes):''}</div></div>`).join('')||'<div class="muted">لا توجد مهام مسجلة.</div>'}
async function resetOperationalData(){
 if(me?.role!=='SUPERVISOR'){alert('هذه الصلاحية للمشرف فقط.');return}
 const ok1=confirm('⚠️ سيتم حذف سجلات الحضور والأنشطة والمهام الحكومية القديمة لجميع الموظفين. لن يتم حذف الموظفين أو الحسابات. هل تريد المتابعة؟');
 if(!ok1)return;
 const phrase=prompt('للتأكيد النهائي، اكتب: بدء سجلات جديدة');
 if(phrase!=='بدء سجلات جديدة'){alert('تم إلغاء العملية.');return}
 try{
  const r=await api('/rest/v1/rpc/supervisor_reset_operational_data',{method:'POST',body:'{}'});
  const n=r||{};
  alert(`✓ تم تهيئة النظام لسجلات جديدة.\nالحضور المحذوف: ${n.attendance??0}\nالأنشطة المحذوفة: ${n.activities??0}\nالمهام الحكومية المحذوفة: ${n.government_tasks??0}`);
  await renderSupervisor();
 }catch(e){
  alert('تعذر مسح السجلات: '+e.message+'\n\nتأكد من إضافة دالة supervisor_reset_operational_data في Supabase.');
 }
}
async function printDailyReport(){if(me?.role!=='SUPERVISOR'){alert('هذه الصلاحية للمشرف فقط.');return}let d=today(),[emps,attRows,acts]=await Promise.all([api('/rest/v1/employees?select=*&active=eq.true&order=name'),api('/rest/v1/attendance?select=*&work_date=eq.'+d),api('/rest/v1/activities?select=*&order=created_at.asc&limit=1000')]),att=Object.fromEntries(attRows.map(x=>[x.employee_id,x]));let w=window.open('','_blank');if(!w){alert('اسمح بفتح نافذة الطباعة.');return}w.document.write(printHeader('كشف الحضور والمتابعة اليومي',d)+`<div class="report-grid"><div class="report-box">الموظفون<b>${emps.length}</b></div><div class="report-box">الحاضرون<b>${attRows.filter(x=>x.check_in).length}</b></div><div class="report-box">المتأخرون<b>${attRows.filter(x=>Number(x.late_minutes||0)>0).length}</b></div></div><table><thead><tr><th>الموظف</th><th>الدور</th><th>الحالة</th><th>الحضور</th><th>التأخير</th><th>الانصراف</th><th>آخر نشاط</th></tr></thead><tbody>${emps.map(e=>{let a=att[e.id],x=acts.find(z=>z.employee_id===e.id);return `<tr><td>${esc(e.name)}</td><td>${roleName(e.role)}</td><td>${statusOf(a)}</td><td>${time(a?.check_in)}</td><td>${a?.late_minutes||0} دقيقة</td><td>${time(effectiveCheckOut(a))}</td><td>${activityName(x?.activity_type)} — ${dateTime(x?.created_at)}</td></tr>`}).join('')}</tbody></table><footer>اعتماد المشرف: علي حسن — التوقيع: __________________</footer></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function printHeader(title,d){return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:12mm}body{font-family:Tahoma,Arial,sans-serif;color:#17202a}header{border-bottom:3px solid #123c5d;padding-bottom:10px;margin-bottom:12px}h1{font-size:20px;color:#123c5d;margin:0 0 4px}h2{font-size:14px;margin:0}.info{display:flex;justify-content:space-between;font-size:11px;margin-top:8px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.report-box{border:1px solid #ddd;border-radius:6px;padding:8px;text-align:center}.report-box b{display:block;font-size:16px}table{width:100%;border-collapse:collapse;font-size:9px}th,td{border:1px solid #aaa;padding:6px}th{background:#eef2f5}footer{margin-top:30px;border-top:1px solid #aaa;padding-top:10px;font-size:11px}</style></head><body><header><h1>حضور ومتابعة فرع المدينة</h1><h2>${esc(title)}</h2><div class="info"><span>التاريخ: ${new Date().toLocaleDateString('ar-SA')}</span><span>المشرف: علي حسن</span></div></header>`}
async function printRepReport(employeeId){if(me?.role!=='SUPERVISOR'){alert('هذه الصلاحية للمشرف فقط.');return}let e=(await api('/rest/v1/employees?select=*&id=eq.'+employeeId))[0];if(!e||e.role!=='FIELD_REP'){alert('التقرير المخصص هنا للمناديب الميدانيين.');return}let d=today(),[attRows,acts]=await Promise.all([api('/rest/v1/attendance?select=*&employee_id=eq.'+employeeId+'&work_date=eq.'+d),api('/rest/v1/activities?select=*&employee_id=eq.'+employeeId+'&order=created_at.asc&limit=500')]),a=attRows[0],vis=acts.filter(x=>String(x.note||'').startsWith('VISIT_'));let w=window.open('','_blank');if(!w){alert('اسمح بفتح نافذة الطباعة.');return}let rows=vis.map(x=>{let p=String(x.note||'').split('|'),arr=String(x.note||'').startsWith('VISIT_ARRIVED');return `<tr><td>${dateTime(x.created_at)}</td><td>${arr?'وصول':'مغادرة'}</td><td>${esc(p[1]||'')}</td><td>${esc(p[2]||'')}</td><td>${x.latitude!=null?Number(x.latitude).toFixed(6)+', '+Number(x.longitude).toFixed(6):'—'}</td></tr>`}).join('');w.document.write(printHeader('تقرير المندوب الميداني — '+e.name,d)+`<div class="report-grid"><div class="report-box">الموظف<b>${esc(e.name)}</b></div><div class="report-box">الحضور<b>${time(a?.check_in)}</b></div><div class="report-box">الانصراف<b>${time(effectiveCheckOut(a))}</b></div><div class="report-box">التأخير<b>${a?.late_minutes||0} دقيقة</b></div><div class="report-box">الزيارات<b>${vis.length}</b></div><div class="report-box">الحالة<b>${statusOf(a)}</b></div></div><h3>الزيارات الميدانية</h3><table><thead><tr><th>الوقت</th><th>الحركة</th><th>العميل / الموقع</th><th>الملاحظات</th><th>GPS</th></tr></thead><tbody>${rows||'<tr><td colspan="5">لا توجد زيارات مسجلة.</td></tr>'}</tbody></table><h3 style="margin-top:18px">الأنشطة الأخرى</h3><table><thead><tr><th>الوقت</th><th>النشاط</th><th>الملاحظات</th><th>GPS</th></tr></thead><tbody>${acts.filter(x=>!String(x.note||'').startsWith('VISIT_')).map(x=>`<tr><td>${dateTime(x.created_at)}</td><td>${activityName(x.activity_type)}</td><td>${esc(x.note||'')}</td><td>${x.latitude!=null?Number(x.latitude).toFixed(6)+', '+Number(x.longitude).toFixed(6):'—'}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد أنشطة أخرى.</td></tr>'}</tbody></table><footer>اعتماد المشرف: علي حسن — التوقيع: __________________</footer></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
async function autoClose(){if(!me?.id||!afterShift())return;try{let rows=await api('/rest/v1/attendance?select=*&employee_id=eq.'+me.id+'&work_date=eq.'+today()),a=rows[0];if(a?.check_in&&!a?.check_out)await api('/rest/v1/attendance?id=eq.'+a.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({check_out:shiftEndDate().toISOString(),updated_at:new Date().toISOString()})})}catch(e){console.warn(e)}}
function schedule(){if(!afterShift()){let ms=shiftEndDate().getTime()-Date.now();if(ms>0&&ms<86400000)setTimeout(()=>location.reload(),ms+1500)}}
schedule();
const reminderEmployee=new URLSearchParams(location.search).get('employee');
if(token)api('/auth/v1/user').then(boot).catch(()=>logout());

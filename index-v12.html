.top{background:linear-gradient(135deg,#0b1f33,#123c5d);color:#fff;padding:22px 18px 28px}.topin{max-width:1180px;margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand h1{font-size:21px;margin:0 0 5px}.brand p{margin:0;color:#cbd8e5;font-size:13px}.wrap{max-width:1180px;margin:-15px auto 35px;padding:0 15px;position:relative}

.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.sectionhead h3{margin:0;font-size:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{color:var(--muted);font-weight:800;background:#fafbfd}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.p-green{background:#ecfdf3;color:#15803d}.p-orange{background:#fff7ed;color:#c2410c}.p-red{background:#fef2f2;color:#b91c1c}.p-blue{background:#eff6ff;color:#1d4ed8}.p-purple{background:#f5f3ff;color:#6d28d9}
.empgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.emp{border:1px solid var(--line);border-radius:15px;padding:14px}.emphead{display:flex;justify-content:space-between;gap:8px}.empname{font-weight:900}.role{font-size:11px;color:var(--muted);margin-top:3px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.meta div{background:#f8fafc;border-radius:10px;padding:9px}.meta small{display:block;color:var(--muted);font-size:10px}.meta b{font-size:12px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.activity{padding:11px;border:1px solid var(--line);border-radius:12px;margin-top:8px}.activity b{font-size:13px}.muted{color:var(--muted);font-size:12px}.notice{display:flex;align-items:flex-start;gap:10px;padding:13px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa;margin-bottom:9px}.notice strong{font-size:13px}.notice span{display:block;color:#9a3412;font-size:12px;margin-top:2px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}.map{height:330px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.confirm-overlay{position:fixed;inset:0;background:#061524aa;display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}.confirm-box{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0005}.confirm-box h3{margin:0 0 8px}.confirm-info{background:#f8fafc;border-radius:13px;padding:13px;margin:12px 0}.confirm-info div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e9eef3;font-size:13px}.confirm-info div:last-child{border-bottom:0}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.report-box{border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center}.report-box b{display:block;font-size:18px;margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar .btn{width:auto}.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.empgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.top{padding:18px 14px 25px}.brand h1{font-size:18px}.wrap{padding:0 10px}.grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat .num{font-size:23px}.empgrid{grid-template-columns:1fr}.card{padding:14px;border-radius:15px}.actions{grid-template-columns:1fr}.userbar{align-items:flex-start}.brand{align-items:flex-start}.report-grid{grid-template-columns:1fr 1fr}.range{grid-template-columns:1fr}}

<body>
<header class="top"><div class="topin"><div class="brand"><div><h1>حضور ومتابعة فرع المدينة</h1><p>نظام متابعة الموظفين الميدانيين والمهام الحكومية — الإصدار 11</p></div><div id="clock" style="font-size:12px;color:#dbeafe;text-align:left"></div></div></div></header>

<section id="loginCard" class="card login"><h2>تسجيل الدخول</h2><p class="muted">ادخل باسم المستخدم وكلمة المرور — لا حاجة للبريد الإلكتروني.</p><div class="field"><label>اسم المستخدم</label><input id="username" type="text" autocomplete="username" autocapitalize="none" placeholder="مثال: ali"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><button id="loginBtn" class="btn">دخول النظام</button><div id="loginMsg" class="msg hidden"></div></section>

<script>
const SB_URL='https://lhwsduzaicatihhqinir.supabase.co';
const SB_KEY='sb_publishable_L7E8EbRqcrbYXoRUBiemhg_-yzrXUXo';
let token=localStorage.getItem('att_token')||'',me=null;let supervisorMap=null,myMap=null;
const $=id=>document.getElementById(id);
const roleName=r=>({SUPERVISOR:'مشرف الفرع',FIELD_REP:'مندوب ميداني',GOVERNMENT_REP:'معقب ومراجعات حكومية',WAREHOUSE_AMIN:'أمين مستودع'}[r]||r||'موظف');
const activityName=x=>({VISIT_CUSTOMER:'زيارة عميل',TRAVELING:'في الطريق',BRANCH:'في الفرع',OTHER:'نشاط آخر'}[x]||x||'—');
const taskName=x=>({NEW:'جديدة',IN_PROGRESS:'تحت الإجراء',COMPLETED:'مكتملة',FOLLOW_UP:'تحتاج متابعة',REJECTED:'مرفوضة'}[x]||x||'—');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function headers(auth=true){return {'apikey':SB_KEY,'Content-Type':'application/json',...(auth&&token?{'Authorization':'Bearer '+token}:{})}}
async function api(path,opt={}){let r=await fetch(SB_URL+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}});let b=null;try{b=await r.json()}catch{}if(!r.ok)throw Error(b?.msg||b?.message||b?.error_description||b?.error||`HTTP ${r.status}`);return b}
function save(d){token=d.access_token;localStorage.setItem('att_token',token)}function logout(){token='';localStorage.removeItem('att_token');location.reload()}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'})}function time(x){return x?new Date(x).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'—'}function dateTime(x){return x?new Date(x).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}):'—'}
function setClock(){let d=new Date();$('clock').innerHTML=d.toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'})+'<br>'+d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}setInterval(setClock,1000);setClock();
let SHIFT_END='17:00',SHIFT_START='08:00',shiftSettingId='';function shiftEndDate(){return new Date(today()+'T'+SHIFT_END+':00+03:00')}function shiftStartDate(){return new Date(today()+'T'+SHIFT_START+':00+03:00')}function afterShift(){return new Date()>=shiftEndDate()}function shiftMessage(){return '<div class="msg err">🔒 انتهى وقت الدوام اليوم الساعة '+SHIFT_END+'.</div>'}function guardAfterShift(){if(afterShift()){alert('انتهى وقت الدوام اليوم الساعة '+SHIFT_END+'.');return true}return false}
async function login(){const username=$('username').value.trim().toLowerCase(),password=$('password').value;if(!username||!password){showLogin('أدخل اسم المستخدم وكلمة المرور.');return}const b=$('loginBtn');b.disabled=true;b.textContent='جارٍ الدخول...';try{const r=await fetch(SB_URL+'/functions/v1/ensure-username-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({username,code:password})});const info=await r.json();if(!r.ok)throw Error(info.error||'اسم المستخدم أو كلمة المرور غير صحيحة');const email=info.email||username+'@attendance.local';let d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password}),auth:false});save(d);await boot(d.user)}catch(e){showLogin('فشل تسجيل الدخول: '+e.message)}finally{b.disabled=false;b.textContent='دخول النظام'}}
function showLogin(t,ok=false){$('loginMsg').className='msg '+(ok?'ok':'err');$('loginMsg').textContent=t}
async function boot(user){try{let rows=await api('/rest/v1/employees?select=*&auth_user_id=eq.'+encodeURIComponent(user.id));if(!rows.length){showLogin('تم الدخول لكن الحساب غير مربوط بموظف.');logout();return}me=rows[0];await loadShiftSettings();$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=me.name;$('userRole').textContent=roleName(me.role);$('avatar').textContent=(me.name||'?').trim().charAt(0);if(me.role==='SUPERVISOR')renderSupervisor();else if(me.role==='GOVERNMENT_REP')renderGov();else renderField()}catch(e){showLogin('تعذر تحميل النظام: '+e.message)}}
$('loginBtn').onclick=e=>{e.preventDefault();login()};$('password').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();login()}};$('username').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();login()}};$('logout').onclick=logout;
async function gps(){if(!navigator.geolocation)throw Error('المتصفح لا يدعم تحديد الموقع');return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>ok(p.coords),()=>no(Error('اسمح بالوصول للموقع ثم حاول مرة أخرى')),{enableHighAccuracy:true,timeout:15000,maximumAge:0}))}
function attendanceConfirmation(c,now){return new Promise(resolve=>{let m=$('confirmModal');m.className='confirm-overlay';m.innerHTML=`<div class="confirm-box"><h3>تأكيد تسجيل الحضور</h3><div class="muted">راجع بيانات الحضور والموقع قبل الاعتماد.</div><div class="confirm-info"><div><span>الموظف</span><b>${esc(me.name)}</b></div><div><span>التاريخ</span><b>${now.toLocaleDateString('ar-SA')}</b></div><div><span>الوقت</span><b>${now.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</b></div><div><span>الموقع</span><b>${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}</b></div><div><span>دقة GPS</span><b>${Math.round(c.accuracy||0)} متر</b></div></div><div class="actions"><button class="btn secondary" id="cancelConfirm">إلغاء</button><button class="btn" id="okConfirm">✓ تأكيد الحضور</button></div></div>`;$('cancelConfirm').onclick=()=>{m.className='hidden';resolve(false)};$('okConfirm').onclick=()=>{m.className='hidden';resolve(true)}})}
async function saveIn(employeeId,c,now,note='تأكيد الحضور'){let d=today(),rows=await api('/rest/v1/attendance?select=*&employee_id=eq.'+employeeId+'&work_date=eq.'+d);let shift=shiftStartDate(),late=Math.max(0,Math.floor((now-shift)/60000));let payload={employee_id:employeeId,work_date:d,check_in:now.toISOString(),start_latitude:c.latitude,start_longitude:c.longitude,start_accuracy:c.accuracy,status:late?'LATE':'PRESENT',late_minutes:late,updated_at:now.toISOString()};let id=rows[0]?.id;if(id)await api('/rest/v1/attendance?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});else{id=(await api('/rest/v1/attendance',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)}))?.[0]?.id}await api('/rest/v1/activities',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({employee_id:employeeId,attendance_id:id||null,activity_type:'OTHER',latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,note})});return id}
async function selfCheckIn(){if(guardAfterShift())return;try{let c=await gps(),now=new Date();if(!await attendanceConfirmation(c,now))return;await saveIn(me.id,c,now,'تأكيد الحضور');await renderSupervisor()}catch(e){alert('تعذر تسجيل الحضور: '+e.message)}}
async function selfCheckOut(){try{let d=today(),rows=await api('/rest/v1/attendance?select=*&employee_id=eq.'+me.id+'&work_date=eq.'+d);if(!rows.length)throw Error('يجب تسجيل الحضور أولًا');await api('/rest/v1/attendance?id=eq.'+rows[0].id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({check_out:new Date().toISOString(),updated_at:new Date().toISOString()})});await renderSupervisor()}catch(e){alert('تعذر تسجيل الانصراف: '+e.message)}}
async function supervisorAttendanceAction(employeeId,action){const labels={CHECK_IN:'تحضير الموظف',CHECK_OUT:'صرف الموظف',REOPEN:'إعادة فتح الدوام'};let reason=prompt(`سبب ${labels[action]||action} (اختياري):`,'تحكم المشرف');if(reason===null)return;try{await api('/rest/v1/rpc/supervisor_attendance_action',{method:'POST',body:JSON.stringify({p_employee_id:employeeId,p_action:action,p_reason:reason||null})});await renderSupervisor()}catch(e){alert('تعذر تنفيذ العملية: '+e.message)}}
function effectiveCheckOut(a){return a?.check_out||(afterShift()&&a?.check_in?shiftEndDate().toISOString():null)}
function statusOf(a){if(a?.check_in)return effectiveCheckOut(a)?'انصرف':'حاضر';return afterShift()?'غائب':'لم يسجل'}function statusPill(a){let s=statusOf(a);return `<span class="pill ${s==='حاضر'?'p-green':s==='انصرف'?'p-blue':s==='غائب'?'p-red':'p-orange'}">${s}</span>`}
function supervisorControls(e,a){if(e.role==='SUPERVISOR')return '';if(!a?.check_in)return `<button class="btn small" onclick="supervisorAttendanceAction('${e.id}','CHECK_IN')">🟢 تحضير</button>`;if(!a?.check_out)return `<button class="btn danger small" onclick="supervisorAttendanceAction('${e.id}','CHECK_OUT')">🔴 صرف</button>`;return `<button class="btn secondary small" onclick="supervisorAttendanceAction('${e.id}','REOPEN')">↩ إعادة فتح</button>`}
function mapPopup(e,a,last){let loc=last?.latitude&&last?.longitude?`${Number(last.latitude).toFixed(6)}, ${Number(last.longitude).toFixed(6)}`:a?.start_latitude&&a?.start_longitude?`${Number(a.start_latitude).toFixed(6)}, ${Number(a.start_longitude).toFixed(6)}`:'لا يوجد';return `<b>${esc(e.name)}</b><br>الحالة: ${statusOf(a)}<br>الحضور: ${time(a?.check_in)}<br>آخر موقع: ${loc}<br>آخر تحديث: ${dateTime(last?.created_at||a?.check_in)}`}
function initSupervisorMap(emps,att,acts){const el=$('supervisorMap');if(!el||typeof L==='undefined')return;if(supervisorMap)supervisorMap.remove();let pts=[];emps.forEach(e=>{let a=att[e.id],last=acts.find(x=>x.employee_id===e.id&&x.latitude!=null&&x.longitude!=null);let lat=last?.latitude??a?.start_latitude,lng=last?.longitude??a?.start_longitude;if(lat!=null&&lng!=null)pts.push([Number(lat),Number(lng),e,a,last])});let center=pts.length?[pts[0][0],pts[0][1]]:[24.47,39.61];supervisorMap=L.map(el).setView(center,12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(supervisorMap);pts.forEach(p=>L.marker([p[0],p[1]]).addTo(supervisorMap).bindPopup(mapPopup(p[2],p[3],p[4])));if(pts.length>1)supervisorMap.fitBounds(pts.map(p=>[p[0],p[1]]),{padding:[25,25]});}
async function showEmployeeDetails(id){let e=(await api('/rest/v1/employees?select=*&id=eq.'+id))[0];if(!e)return;let d=today(),a=(await api('/rest/v1/attendance?select=*&employee_id=eq.'+id+'&work_date=eq.'+d))[0];let acts=await api('/rest/v1/activities?select=*&employee_id=eq.'+id+'&order=created_at.asc&limit=200');let todayActs=acts.filter(x=>String(x.created_at||'').slice(0,10)===d);let last=[...todayActs].reverse().find(x=>x.latitude!=null&&x.longitude!=null);let modal=$('confirmModal');modal.className='confirm-overlay';modal.innerHTML=`<div class="confirm-box"><div class="sectionhead"><h3>${esc(e.name)} — التفاصيل اليومية</h3><button id="closeD" class="btn secondary small">إغلاق</button></div><div class="grid"><div class="stat"><div class="label">الحالة</div><div class="num">${statusOf(a)}</div></div><div class="stat"><div class="label">الحضور</div><div class="num">${time(a?.check_in)}</div></div><div class="stat"><div class="label">التأخير</div><div class="num orange">${a?.late_minutes||0} د</div></div><div class="stat"><div class="label">الانصراف</div><div class="num">${time(effectiveCheckOut(a))}</div></div></div><div class="actions no-print" style="margin-top:12px"><button class="btn secondary" onclick="showLocation(${last?.latitude??a?.start_latitude},${last?.longitude??a?.start_longitude},'آخر موقع — ${esc(e.name)}')">📍 آخر موقع</button>${e.role==='FIELD_REP'?`<button class="btn" onclick="printRepReport('${e.id}')">🖨️ تقرير المندوب</button>`:''}</div><div class="card"><h3>الأنشطة والزيارات اليوم</h3>${todayActs.length?todayActs.map(x=>{let n=String(x.note||'بدون ملاحظة');let title=activityName(x.activity_type);if(n.startsWith('VISIT_ARRIVED|')){let p=n.split('|');title='🟢 وصول: '+(p[1]||'موقع')}else if(n.startsWith('VISIT_LEFT|')){let p=n.split('|');title='🔵 مغادرة: '+(p[1]||'موقع')}let loc=x.latitude!=null?`<button class="btn secondary small" onclick="showLocation(${Number(x.latitude)},${Number(x.longitude)},'${esc(title).replace(/'/g,"&#39;")}')">📍 الموقع</button>`:'';return `<div class="activity"><b>${esc(title)}</b><div class="muted">${dateTime(x.created_at)} — ${esc(n)}</div>${loc}</div>`}).join(''):'<div class="muted">لا يوجد نشاط اليوم.</div>'}</div></div>`;$('closeD').onclick=()=>modal.className='hidden'}
function showLocation(lat,lng,title){if(lat==null||lng==null){alert('لا يوجد موقع مسجل.');return}let modal=$('confirmModal');modal.className='confirm-overlay';modal.innerHTML=`<div class="confirm-box"><div class="sectionhead"><h3>${esc(title)}</h3><button id="closeM" class="btn secondary small">إغلاق</button></div><div id="singleMap" class="map"></div><div class="muted" style="margin-top:8px">الإحداثيات: ${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}</div></div>`;$('closeM').onclick=()=>modal.className='hidden';setTimeout(()=>{let m=L.map('singleMap').setView([Number(lat),Number(lng)],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);L.marker([Number(lat),Number(lng)]).addTo(m).bindPopup(esc(title)).openPopup()},50)}

function drawGovMap(lat,lng,name){let el=$('govMap');if(!el||typeof L==='undefined')return;let m=L.map(el).setView([Number(lat),Number(lng)],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);L.marker([Number(lat),Number(lng)]).addTo(m).bindPopup(esc(name)).openPopup()}
async function addGov(){if(guardAfterShift())return;try{let authority=$('authority').value.trim(),transaction=$('transaction').value.trim();if(!authority||!transaction)throw Error('أدخل الجهة والمعاملة أولًا');await api('/rest/v1/government_tasks',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({employee_id:me.id,authority,transaction,status:$('taskStatus').value,notes:$('taskNote').value.trim(),started_at:new Date().toISOString()})});$('authority').value='';$('transaction').value='';$('taskNote').value='';$('govTaskMsg').innerHTML='<div class="msg ok">✓ تمت إضافة المهمة.</div>';await loadGov()}catch(e){$('govTaskMsg').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
async function loadGov(){let rows=await api('/rest/v1/government_tasks?select=*&employee_id=eq.'+me.id+'&order=created_at.desc&limit=100');$('govList').innerHTML=rows.map(t=>`<div class="activity"><div style="display:flex;justify-content:space-between"><b>${esc(t.authority)}</b><span class="pill p-blue">${taskName(t.status)}</span></div><div>${esc(t.transaction)}</div><div class="muted">${dateTime(t.created_at)}${t.notes?' — '+esc(t.notes):''}</div></div>`).join('')||'<div class="muted">لا توجد مهام مسجلة.</div>'}
async function resetOperationalData(){
 if(me?.role!=='SUPERVISOR'){alert('هذه الصلاحية للمشرف فقط.');return}
 const ok1=confirm('⚠️ سيتم حذف سجلات الحضور والأنشطة والمهام الحكومية القديمة لجميع الموظفين. لن يتم حذف الموظفين أو الحسابات. هل تريد المتابعة؟');
 if(!ok1)return;
 const phrase=prompt('للتأكيد النهائي، اكتب: بدء سجلات جديدة');
 if(phrase!=='بدء سجلات جديدة'){alert('تم إلغاء العملية.');return}
 try{
  const r=await api('/rest/v1/rpc/supervisor_reset_operational_data',{method:'POST',body:'{}'});
  const n=r||{};
  alert(`✓ تم تهيئة النظام لسجلات جديدة.\nالحضور المحذوف: ${n.attendance??0}\nالأنشطة المحذوفة: ${n.activities??0}\nالمهام الحكومية المحذوفة: ${n.government_tasks??0}`);
  await renderSupervisor();
 }catch(e){
  alert('تعذر مسح السجلات: '+e.message+'\n\nتأكد من إضافة دالة supervisor_reset_operational_data في Supabase.');
 }
}
async function printDailyReport(){if(me?.role!=='SUPERVISOR'){alert('هذه الصلاحية للمشرف فقط.');return}let d=today(),[emps,attRows,acts]=await Promise.all([api('/rest/v1/employees?select=*&active=eq.true&order=name'),api('/rest/v1/attendance?select=*&work_date=eq.'+d),api('/rest/v1/activities?select=*&order=created_at.asc&limit=1000')]),att=Object.fromEntries(attRows.map(x=>[x.employee_id,x]));let w=window.open('','_blank');if(!w){alert('اسمح بفتح نافذة الطباعة.');return}w.document.write(printHeader('كشف الحضور والمتابعة اليومي',d)+`<div class="report-grid"><div class="report-box">الموظفون<b>${emps.length}</b></div><div class="report-box">الحاضرون<b>${attRows.filter(x=>x.check_in).length}</b></div><div class="report-box">المتأخرون<b>${attRows.filter(x=>Number(x.late_minutes||0)>0).length}</b></div></div><table><thead><tr><th>الموظف</th><th>الدور</th><th>الحالة</th><th>الحضور</th><th>التأخير</th><th>الانصراف</th><th>آخر نشاط</th></tr></thead><tbody>${emps.map(e=>{let a=att[e.id],x=acts.find(z=>z.employee_id===e.id);return `<tr><td>${esc(e.name)}</td><td>${roleName(e.role)}</td><td>${statusOf(a)}</td><td>${time(a?.check_in)}</td><td>${a?.late_minutes||0} دقيقة</td><td>${time(effectiveCheckOut(a))}</td><td>${activityName(x?.activity_type)} — ${dateTime(x?.created_at)}</td></tr>`}).join('')}</tbody></table><footer>اعتماد المشرف: علي حسن — التوقيع: __________________</footer></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function printHeader(title,d){return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:12mm}body{font-family:Tahoma,Arial,sans-serif;color:#17202a}header{border-bottom:3px solid #123c5d;padding-bottom:10px;margin-bottom:12px}h1{font-size:20px;color:#123c5d;margin:0 0 4px}h2{font-size:14px;margin:0}.info{display:flex;justify-content:space-between;font-size:11px;margin-top:8px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.report-box{border:1px solid #ddd;border-radius:6px;padding:8px;text-align:center}.report-box b{display:block;font-size:16px}table{width:100%;border-collapse:collapse;font-size:9px}th,td{border:1px solid #aaa;padding:6px}th{background:#eef2f5}footer{margin-top:30px;border-top:1px solid #aaa;padding-top:10px;font-size:11px}</style></head><body><header><h1>حضور ومتابعة فرع المدينة</h1><h2>${esc(title)}</h2><div class="info"><span>التاريخ: ${new Date().toLocaleDateString('ar-SA')}</span><span>المشرف: علي حسن</span></div></header>`}
async function printRepReport(employeeId){if(me?.role!=='SUPERVISOR'){alert('هذه الصلاحية للمشرف فقط.');return}let e=(await api('/rest/v1/employees?select=*&id=eq.'+employeeId))[0];if(!e||e.role!=='FIELD_REP'){alert('التقرير المخصص هنا للمناديب الميدانيين.');return}let d=today(),[attRows,acts]=await Promise.all([api('/rest/v1/attendance?select=*&employee_id=eq.'+employeeId+'&work_date=eq.'+d),api('/rest/v1/activities?select=*&employee_id=eq.'+employeeId+'&order=created_at.asc&limit=500')]),a=attRows[0],vis=acts.filter(x=>String(x.note||'').startsWith('VISIT_'));let w=window.open('','_blank');if(!w){alert('اسمح بفتح نافذة الطباعة.');return}let rows=vis.map(x=>{let p=String(x.note||'').split('|'),arr=String(x.note||'').startsWith('VISIT_ARRIVED');return `<tr><td>${dateTime(x.created_at)}</td><td>${arr?'وصول':'مغادرة'}</td><td>${esc(p[1]||'')}</td><td>${esc(p[2]||'')}</td><td>${x.latitude!=null?Number(x.latitude).toFixed(6)+', '+Number(x.longitude).toFixed(6):'—'}</td></tr>`}).join('');w.document.write(printHeader('تقرير المندوب الميداني — '+e.name,d)+`<div class="report-grid"><div class="report-box">الموظف<b>${esc(e.name)}</b></div><div class="report-box">الحضور<b>${time(a?.check_in)}</b></div><div class="report-box">الانصراف<b>${time(effectiveCheckOut(a))}</b></div><div class="report-box">التأخير<b>${a?.late_minutes||0} دقيقة</b></div><div class="report-box">الزيارات<b>${vis.length}</b></div><div class="report-box">الحالة<b>${statusOf(a)}</b></div></div><h3>الزيارات الميدانية</h3><table><thead><tr><th>الوقت</th><th>الحركة</th><th>العميل / الموقع</th><th>الملاحظات</th><th>GPS</th></tr></thead><tbody>${rows||'<tr><td colspan="5">لا توجد زيارات مسجلة.</td></tr>'}</tbody></table><h3 style="margin-top:18px">الأنشطة الأخرى</h3><table><thead><tr><th>الوقت</th><th>النشاط</th><th>الملاحظات</th><th>GPS</th></tr></thead><tbody>${acts.filter(x=>!String(x.note||'').startsWith('VISIT_')).map(x=>`<tr><td>${dateTime(x.created_at)}</td><td>${activityName(x.activity_type)}</td><td>${esc(x.note||'')}</td><td>${x.latitude!=null?Number(x.latitude).toFixed(6)+', '+Number(x.longitude).toFixed(6):'—'}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد أنشطة أخرى.</td></tr>'}</tbody></table><footer>اعتماد المشرف: علي حسن — التوقيع: __________________</footer></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
async function autoClose(){if(!me?.id||!afterShift())return;try{let rows=await api('/rest/v1/attendance?select=*&employee_id=eq.'+me.id+'&work_date=eq.'+today()),a=rows[0];if(a?.check_in&&!a?.check_out)await api('/rest/v1/attendance?id=eq.'+a.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({check_out:shiftEndDate().toISOString(),updated_at:new Date().toISOString()})})}catch(e){console.warn(e)}}
function schedule(){if(!afterShift()){let ms=shiftEndDate().getTime()-Date.now();if(ms>0&&ms<86400000)setTimeout(()=>location.reload(),ms+1500)}}
schedule();if(token)api('/auth/v1/user').then(boot).catch(()=>logout());
</script>
